name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          
          # ১. SDK Version ৩৪ (Android 14) সেট করা - এটি লেটেস্ট ফোনের জন্য জরুরি
          VARS="android/variables.gradle"
          if [ -f "$VARS" ]; then
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' $VARS
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' $VARS
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' $VARS
          fi

          npx cap sync android

          # ২. ইউনিভার্সাল ম্যানিফেস্ট (Android 11 এবং Android 14 দুইটার জন্যই)
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.kamaclock.controller">

              <uses-permission android:name="android.permission.INTERNET" />
              
              <!-- Android 11 ও নিচের জন্য -->
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              
              <!-- Android 12 ও উপরের জন্য (Nearby Devices) -->
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" 
                  android:usesPermissionFlags="neverForLocation" 
                  tools:targetApi="31" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" tools:targetApi="31" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" tools:targetApi="31" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Kama Clock Controller"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.getcapacitor.BridgeActivity"
                      android:label="Kama Clock Controller"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTop"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ৩. আইকন জেনারেট করা
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kama-clock-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
