name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          
          # ১. SDK Version ৩৬-এ সেট করা (নতুন লাইব্রেরির জন্য জরুরি)
          VARS="android/variables.gradle"
          if [ -f "$VARS" ]; then
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' $VARS
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' $VARS
          fi

          npx cap sync android

          # ২. ম্যানিফেস্ট ফাইলে পারমিশন ইনজেকশন (Sync এর পরে)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Remove existing to avoid duplicates
            sed -i '/android.permission.BLUETOOTH/d' $MANIFEST
            sed -i '/android.permission.ACCESS_FINE_LOCATION/d' $MANIFEST
            
            PERMS='<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
            sed -i "/<application/i \    $PERMS" $MANIFEST
          fi

          # ৩. আইকন জেনারেট করা (আপনার আইকন ফিরে আসবে)
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kama-clock-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
