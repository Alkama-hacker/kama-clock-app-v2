name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          
          # ১. সরাসরি build.gradle ফাইলে SDK ৩৬ সেট করা (যাতে কোনো এরর না আসে)
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' $APP_GRADLE
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' $APP_GRADLE
          fi

          # ২. ম্যানিফেস্ট ফাইলে পারমিশনগুলো একদম শুরুতে ইনজেক্ট করা
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # ডুপ্লিকেট পারমিশন মুছে ফেলা
            sed -i '/android.permission.BLUETOOTH/d' $MANIFEST
            sed -i '/android.permission.ACCESS_FINE_LOCATION/d' $MANIFEST
            sed -i '/android.permission.ACCESS_COARSE_LOCATION/d' $MANIFEST
            
            # নতুন পারমিশনগুলো একদম টপে বসানো
            PERMS='<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
            sed -i "/<manifest/a \    $PERMS" $MANIFEST
          fi

          # ৩. আইকন জেনারেট করা
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kama-clock-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
